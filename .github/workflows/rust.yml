name: Rust application validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --features test-adapter --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --features test-adapter --all-targets --target ${{ matrix.target }}
      - run: cargo build --locked --release --bin codex-sandbox --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-sandbox-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/codex-sandbox
            target/${{ matrix.target }}/release/codex-sandbox.exe
          if-no-files-found: error
