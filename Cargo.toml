[package]
name = "smolsandbox"
version = "0.15.0"
edition = "2021"
description = "Persistent coding-agent sandboxes through SmolVM"
license = "MIT"

[features]
test-adapter = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.2"

[dev-dependencies]
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }

[[bin]]
name = "smolsbx"
path = "src/main.rs"

[[bin]]
name = "smolvm-test-double"
path = "tests/support/smolvm.rs"

[profile.release]
lto = true
strip = true
