[package]
name = "smolsandbox"
version = "0.9.1"
edition = "2021"
description = "Persistent coding-agent sandboxes through SmolVM"

[features]
test-adapter = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1.2"

[[bin]]
name = "smolsandbox"
path = "src/main.rs"

[[bin]]
name = "smolvm-test-double"
path = "tests/support/smolvm.rs"

[profile.release]
lto = true
strip = true
